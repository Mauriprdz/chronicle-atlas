<!DOCTYPE html>
<html lang="en" data-theme="atlas">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chronicle Atlas · Thematic Investigation Platform</title>
  <meta name="description" content="Research platform with dynamic themes for 20 civilizations and states." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23d6b26a'/%3E%3Cpath d='M32 10 L38 32 L32 54 L26 32Z' fill='%2314161d'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;700&family=IM+Fell+English&family=Josefin+Sans:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Marcellus&family=Nunito+Sans:wght@400;700&family=Philosopher:wght@400;700&family=Playfair+Display:wght@500;700&family=Source+Serif+4:wght@400;600&family=Spectral:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/themes.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="4"/><path d="M32 8 L39 32 L32 56 L25 32Z" fill="currentColor"/></svg>
      <span id="site-name">Chronicle Atlas</span>
    </a>
    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav" class="nav"></nav>
  </header>
  <div id="announcement" class="announcement" hidden></div>
  <main id="main" tabindex="-1"><div class="loading">Loading the archives…</div></main>
  <footer class="footer">
    <p>Chronicle Atlas · U3 A1–A5 · Professional Web Development · UTCH BIS</p>
    <p class="muted small">Theme: <span id="theme-name">Atlas</span></p>
  </footer>

  <!-- Required: floating brain button, bottom-left, on every view -->
  <button id="brain-btn" class="brain-btn" aria-label="Open research companion" aria-expanded="false" aria-controls="brain-panel" title="Research companion">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
      <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
    </svg>
  </button>
  <aside id="brain-panel" class="brain-panel" hidden aria-label="Research companion"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
